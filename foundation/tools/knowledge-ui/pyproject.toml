[project]
name = "knowledge-ui"
version = "0.1.0"
description = "カタログ駆動の知識連合検索・閲覧WebUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "meilisearch>=0.31",
    "markdown-it-py[linkify]>=3.0",
    "pygments>=2.18",
    "httpx>=0.27",
    "mdit-py-plugins>=0.5,<0.6",
    "pyyaml>=6.0",
    "mcp>=1.13,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
notebook = ["marimo>=0.13"]
